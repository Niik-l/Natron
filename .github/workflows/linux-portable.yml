# Portable Linux build: the same Natron + Cycles + FastVolume + OFX plugins as
# linux-build.yml, but built inside the Academy Software Foundation's VFX
# Reference Platform image (Rocky Linux 8, glibc 2.28), so the AppImage runs
# on Rocky/RHEL/Alma 8+ and practically every other current distro.
#
# The image provides Qt/PySide6 6.8.3, Python 3.13, OIIO 3.1, OCIO 2.5,
# OpenVDB 13, Embree, OIDN, OpenSubdiv, oneTBB, Boost, Alembic and GCC 14
# (all under /usr/local). Added here: NanoVDB headers; OpenPGL, x264, x265
# and FFmpeg built from source (cached); OpenJPEG/WebP (Rocky packages);
# qtpy/packaging/patchelf (pip).
#
# The image is ~5 GB compressed, so the job frees runner disk space and runs
# it as a long-lived container (`docker exec` per step) instead of via
# `container:`, which would pull before any step could free space.
# The workspace is mounted at /w inside the container.

name: Linux Portable

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Build Cycles + CyclesRender'
        type: boolean
        default: true
      fastvolume:
        description: 'Build FastVolumeRender (wgpu-native)'
        type: boolean
        default: true
      build_type:
        description: 'CMake build type'
        type: choice
        options: [RelWithDebInfo, Release, Debug]
        default: RelWithDebInfo

concurrency:
  group: linux-portable-${{ github.ref }}
  cancel-in-progress: true

env:
  # VFX Reference Platform CY2026, pinned to a dated build (2026-08-31).
  ASWF_IMAGE: aswf/ci-vfxall:2026-clang19.6
  ASWF_TAG: 2026-clang19.6
  OPENVDB_VERSION: 13.0.0    # the image's OpenVDB; NanoVDB headers must match
  # Built from source into /usr/local and cached (see "extra deps" below).
  OPENPGL_VERSION: v0.7.1    # same as Fedora 44 ships
  FFMPEG_VERSION: n8.0.3     # FFmpeg 8 (libavcodec 62) is what the Fedora build uses
  X264_COMMIT: b35605ace3ddf7c1a5d67a2eb553f034aef41d55   # stable branch, 2026-09
  X265_VERSION: 4.1
  DEPS_KEY: openpgl-v0.7.1_ffmpeg-n8.0.3_x264-b35605a_x265-4.1
  CYCLES_REPO: Niik-l/cycles
  CYCLES_REF: feature/cycles-deep
  WGPU_VERSION: v27.0.4.0
  WGPU_SHA256: 271481ef76fbf3ea09631a6079e9493636ecf813cd9c92306c44a1a452991ba1
  NAME: portable-rocky8-${{ inputs.build_type }}

jobs:
  portable:
    name: Rocky 8 (ASWF) ${{ inputs.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Checkout Natron
        uses: actions/checkout@v4
        with:
          path: natron
          submodules: recursive

      # Same pinned plugin commits as the Windows and Fedora builds.
      - name: Read pinned plugin refs
        id: refs
        run: |
          cfg=natron/tools/win-build/config.sh
          misc=$(grep -m1 '^OPENFX_MISC_REF=' "$cfg" | cut -d'"' -f2)
          io=$(grep -m1 '^OPENFX_IO_REF=' "$cfg" | cut -d'"' -f2)
          [ -n "$misc" ] && [ -n "$io" ] || { echo "::error::could not read plugin refs from $cfg"; exit 1; }
          echo "misc=$misc" >> "$GITHUB_OUTPUT"
          echo "io=$io" >> "$GITHUB_OUTPUT"

      - name: Checkout openfx-misc
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx-misc
          ref: ${{ steps.refs.outputs.misc }}
          path: openfx-misc
          submodules: recursive

      - name: Checkout openfx-io
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx-io
          ref: ${{ steps.refs.outputs.io }}
          path: openfx-io
          submodules: recursive

      - name: Checkout natron-plugins
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/natron-plugins
          path: natron-plugins

      - name: Checkout Cycles fork
        if: inputs.cycles
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CYCLES_REPO }}
          ref: ${{ env.CYCLES_REF }}
          path: cycles

      - name: Cycles cache key
        if: inputs.cycles
        id: cycles-key
        run: echo "sha=$(git -C cycles rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Cycles build
        if: inputs.cycles
        id: cycles-cache
        uses: actions/cache@v4
        with:
          path: cycles/build
          key: portable-cycles-${{ env.ASWF_TAG }}-${{ steps.cycles-key.outputs.sha }}-${{ inputs.build_type }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: portable-ccache-${{ env.ASWF_TAG }}-${{ inputs.build_type }}-${{ github.sha }}
          restore-keys: portable-ccache-${{ env.ASWF_TAG }}-${{ inputs.build_type }}-

      # Source-built extras (OpenPGL, x264, x265, FFmpeg) as an install tree
      # staged under extra-deps/, cached per image tag + versions.
      - name: Restore extra deps
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: extra-deps
          key: portable-deps-${{ env.ASWF_TAG }}-${{ env.DEPS_KEY }}

      - name: Fetch wgpu-native
        if: inputs.fastvolume
        run: |
          curl -fsSL -o wgpu.zip \
            "https://github.com/gfx-rs/wgpu-native/releases/download/$WGPU_VERSION/wgpu-linux-x86_64-release.zip"
          echo "$WGPU_SHA256  wgpu.zip" | sha256sum -c -
          unzip -q wgpu.zip -d wgpu-release
          mkdir -p wgpu
          cp wgpu-release/include/webgpu/webgpu.h wgpu-release/include/webgpu/wgpu.h \
             wgpu-release/lib/libwgpu_native.a wgpu/

      - name: Start the build container
        run: |
          docker pull "$ASWF_IMAGE"
          docker run -d --name natron-build -v "$GITHUB_WORKSPACE:/w" -w /w \
            -e CCACHE_DIR=/w/.ccache -e CCACHE_MAXSIZE=3G \
            -e BT="${{ inputs.build_type }}" \
            "$ASWF_IMAGE" sleep infinity
          df -h /

      - name: Install the missing dependencies
        run: |
          docker exec -e OPENVDB_VERSION -e OPENPGL_VERSION -e FFMPEG_VERSION -e X264_COMMIT -e X265_VERSION \
            -e DEPS_HIT="${{ steps.deps-cache.outputs.cache-hit }}" natron-build bash -eo pipefail -c '
            # The checkouts belong to the runner user, not the container root;
            # without this git refuses to touch them ("dubious ownership").
            git config --global --add safe.directory "*"
            # Rocky 8 packages for what the image lacks (nasm: x264/FFmpeg asm).
            dnf install -y -q openjpeg2-devel libwebp-devel patch file unzip gdb nasm
            # qtpy + packaging: Natron imports qtpy at startup. patchelf: the AppImage script.
            python3 -m pip install -q qtpy packaging patchelf
            # The image installs to /usr/local; make sure ldd/ld.so see it
            # (linuxdeploy resolves dependencies through ldd).
            printf "/usr/local/lib\n/usr/local/lib64\n" > /etc/ld.so.conf.d/zz-usr-local.conf
            ldconfig

            echo "== NanoVDB headers (OpenVDB $OPENVDB_VERSION)"
            curl -fsSL "https://github.com/AcademySoftwareFoundation/openvdb/archive/refs/tags/v$OPENVDB_VERSION.tar.gz" \
              | tar -xz -C /tmp "openvdb-$OPENVDB_VERSION/nanovdb/nanovdb"
            cp -r "/tmp/openvdb-$OPENVDB_VERSION/nanovdb/nanovdb" /usr/local/include/
            test -f /usr/local/include/nanovdb/NanoVDB.h

            # Source-built extras. Each installs into the staging tree
            # /w/extra-deps (DESTDIR) and is then copied into /, so later
            # packages find earlier ones and the tree can be cached whole.
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            D=/w/extra-deps
            stage() { cp -a "$D/." / && ldconfig; }
            run() { # name log-file command...
              local n=$1 l=/tmp/$2; shift 2
              "$@" > "$l" 2>&1 || { echo "::error::$n failed; last 60 lines of $l:"; tail -60 "$l"; exit 1; }
            }
            if [ "$DEPS_HIT" = "true" ] && [ -f "$D/.complete" ]; then
              echo "== Extra deps: restored from cache"
              stage
            else
              rm -rf "$D"; mkdir -p "$D"

              echo "== OpenPGL $OPENPGL_VERSION (Cycles path guiding)"
              git clone -q --depth 1 --branch "$OPENPGL_VERSION" https://github.com/RenderKit/openpgl /tmp/openpgl
              run "OpenPGL configure" openpgl-cfg.log cmake -S /tmp/openpgl -B /tmp/openpgl/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DTBB_ROOT=/usr/local -DOPENPGL_BUILD_STATIC=OFF
              run "OpenPGL build" openpgl-build.log env DESTDIR=$D ninja -C /tmp/openpgl/build install
              stage

              echo "== x264 (stable @ ${X264_COMMIT:0:7})"
              git clone -q https://code.videolan.org/videolan/x264.git /tmp/x264
              git -C /tmp/x264 checkout -q "$X264_COMMIT"
              ( cd /tmp/x264 && run "x264 configure" x264-cfg.log ./configure --prefix=/usr/local \
                  --enable-shared --disable-static --disable-cli --enable-pic \
                && run "x264 build" x264-build.log make -j"$(nproc)" \
                && run "x264 install" x264-install.log make install DESTDIR=$D )
              stage

              echo "== x265 $X265_VERSION"
              git clone -q --depth 1 --branch "$X265_VERSION" https://bitbucket.org/multicoreware/x265_git.git /tmp/x265
              run "x265 configure" x265-cfg.log cmake -S /tmp/x265/source -B /tmp/x265/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DENABLE_SHARED=ON -DENABLE_CLI=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
              run "x265 build" x265-build.log env DESTDIR=$D ninja -C /tmp/x265/build install
              stage

              echo "== FFmpeg $FFMPEG_VERSION (+x264/x265, GPL)"
              git clone -q --depth 1 --branch "$FFMPEG_VERSION" https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
              ( cd /tmp/ffmpeg && run "FFmpeg configure" ffmpeg-cfg.log ./configure --prefix=/usr/local \
                  --enable-shared --disable-static --enable-pic --disable-programs --disable-doc \
                  --enable-gpl --enable-libx264 --enable-libx265 \
                && run "FFmpeg build" ffmpeg-build.log make -j"$(nproc)" \
                && run "FFmpeg install" ffmpeg-install.log make install DESTDIR=$D )
              stage
              touch "$D/.complete"
            fi

            echo "== Toolchain"
            gcc --version | sed -n 1p; cmake --version | sed -n 1p; python3 --version
            echo "qmake: $(command -v qmake6 || command -v qmake || echo MISSING)"
            echo "oneTBB: $(ls /usr/local/lib*/libtbb.so 2>/dev/null | head -1)"
            echo "openpgl: $(ls /usr/local/lib*/libopenpgl.so* 2>/dev/null | head -1)"
            echo "ffmpeg:  $(pkg-config --modversion libavcodec 2>/dev/null || echo MISSING) (libavcodec)"
            echo "x264/x265: $(pkg-config --modversion x264 2>/dev/null || echo MISSING) / $(pkg-config --modversion x265 2>/dev/null || echo MISSING)"
          '

      - name: Build Cycles
        if: inputs.cycles && steps.cycles-cache.outputs.cache-hit != 'true'
        run: |
          docker exec natron-build bash -eo pipefail -c '
            cd /w/cycles
            # Flags as tools/win-build/03-cycles.sh and linux-build.yml, plus
            # TBB_ROOT_DIR / OPENVDB_ROOT_DIR so the image copies in /usr/local
            # win over Rocky 8s old system TBB (libtbb.so.2).
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=$BT \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DWITH_CYCLES_STANDALONE=ON -DWITH_CYCLES_STANDALONE_GUI=OFF \
              -DWITH_CYCLES_HYDRA_RENDER_DELEGATE=OFF \
              -DWITH_CYCLES_USD=OFF -DWITH_USD=OFF -DWITH_CYCLES_OSL=OFF \
              -DWITH_CYCLES_DEVICE_CUDA=OFF -DWITH_CYCLES_DEVICE_OPTIX=OFF \
              -DWITH_CYCLES_DEVICE_HIP=OFF -DWITH_CYCLES_DEVICE_ONEAPI=OFF \
              -DWITH_CYCLES_EMBREE=ON -DWITH_CYCLES_OPENIMAGEDENOISE=ON \
              -DWITH_CYCLES_OPENCOLORIO=ON -DWITH_CYCLES_OPENSUBDIV=ON \
              -DWITH_CYCLES_OPENVDB=ON -DWITH_CYCLES_ALEMBIC=OFF \
              -DWITH_CYCLES_LOGGING=OFF -DWITH_LIBS_PRECOMPILED=OFF \
              -DTBB_ROOT_DIR=/usr/local -DOPENVDB_ROOT_DIR=/usr/local
            ninja -C build -j"$(nproc)"
            test -f build/lib/libcycles_subd.a || { echo "::error::Cycles build incomplete"; exit 1; }
          '

      - name: Configure Natron
        run: |
          docker exec natron-build bash -eo pipefail -c '
            cd /w/natron
            # Link the images oneTBB, not Rocky 8s old system libtbb.so.2.
            TBB=$(ls /usr/local/lib*/libtbb.so 2>/dev/null | head -1)
            [ -n "$TBB" ] || { echo "::error::oneTBB libtbb.so not found in /usr/local"; exit 1; }
            export CXXFLAGS="-isystem /usr/local/include/Imath -isystem /usr/local/include/OpenEXR"
            # No native Wayland GL context: Rocky 8s EGL headers predate the
            # PFNEGL*PROC typedefs OSGLContext_wayland.cpp uses. Nothing is lost:
            # the AppImage ships only Qts X11 (xcb) plugin, so Wayland desktops
            # run it through XWayland anyway. The Fedora build keeps Wayland.
            # The images Qt and HarfBuzz need FreeType 2.13 (in /usr/local);
            # Rocky 8s FreeType 2.9 in /usr/lib64 lacks FT_Get_Paint & co.
            # Cairo (Rocky only) pulls freetype2 in by full path via pkg-config,
            # so pkg-config must prefer the images .pc files; rpath-link covers
            # the libraries only other libraries depend on.
            # The image ships libfreetype 2.13 but no freetype2.pc, so describe
            # it ourselves (its headers if present, else Rocky: a newer
            # FreeType library accepts older headers).
            ftinc=$(dirname "$(find /usr/local/include /usr/include -name ft2build.h 2>/dev/null | head -1)")
            mkdir -p /tmp/pc
            printf "%s\n" "libdir=/usr/local/lib" "includedir=$ftinc" "" \
              "Name: FreeType 2" "Description: FreeType 2.13 from the ASWF image" \
              "Version: 26.1.20" "Libs: -L\${libdir} -lfreetype" "Cflags: -I\${includedir}" \
              > /tmp/pc/freetype2.pc
            export PKG_CONFIG_PATH="/tmp/pc:/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/local/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            ft=$(pkg-config --variable=libdir freetype2 2>/dev/null)
            echo "freetype2 $(pkg-config --modversion freetype2 2>/dev/null) from ${ft:-nowhere}"
            case "$ft" in /usr/local/*) ;; *)
              echo "::error::pkg-config resolves freetype2 to ${ft:-nothing}, not the images /usr/local copy"
              ls -l /usr/local/lib*/libfreetype* /usr/local/lib*/pkgconfig/freetype2.pc 2>&1 || true
              exit 1 ;;
            esac
            LINK="-Wl,-rpath-link,/usr/local/lib:/usr/local/lib64"
            # CMake turns pkg-config -l flags into files by searching every -L
            # dir in order; Cairos -L/usr/lib64 comes first, so -lfreetype
            # matched Rockys copy. Preset those lookups to the images FreeType
            # (Qt6s own FreeType lookup already finds /usr/local).
            FT_LIB=/usr/local/lib/libfreetype.so
            cmake -S . -B build -G Ninja \
              -Dpkgcfg_lib_Cairo_freetype=$FT_LIB -Dpkgcfg_lib_PKG_FONTCONFIG_freetype=$FT_LIB \
              -DCMAKE_EXE_LINKER_FLAGS="$LINK" -DCMAKE_SHARED_LINKER_FLAGS="$LINK" \
              -DCMAKE_DISABLE_FIND_PACKAGE_Wayland=TRUE \
              -DCMAKE_BUILD_TYPE=$BT \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DNATRON_QT6=ON \
              -DNATRON_BUILD_TESTS=OFF \
              -DNATRON_FASTVOLUME=${{ inputs.fastvolume && 'ON' || 'OFF' }} \
              -DNATRON_WGPU_DIR=/w/wgpu \
              -DNATRON_CYCLES=${{ inputs.cycles && 'ON' || 'OFF' }} \
              -DNATRON_CYCLES_DIR=/w/cycles \
              -DNATRON_CYCLES_BUILD_DIR=/w/cycles/build \
              -DNATRON_LLVM_INSTALL_DIR=/usr/local \
              -DTBB_LIB="$TBB" \
              2>&1 | tee /w/configure.log
          '

      - name: Build Natron
        run: |
          docker exec natron-build bash -eo pipefail -c '
            ninja -C /w/natron/build -k 0 -j"$(nproc)" 2>&1 | tee /w/build.log
          '

      - name: Build OFX plugins
        if: ${{ !cancelled() }}
        # PKG_CONFIG_PATH: openfx-io finds FFmpeg through pkg-config; it lives in /usr/local.
        run: |
          docker exec -e PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig \
            natron-build bash /w/natron/tools/linux/build-plugins.sh /w "${{ inputs.build_type }}"

      - name: Check the binaries link
        run: |
          docker exec -e FV="${{ inputs.fastvolume }}" natron-build bash -eo pipefail -c '
            cd /w; B=natron/build; bad=0
            for f in $B/App/Natron $B/Renderer/NatronRenderer $B/PythonBin/natron-python \
                     $(find openfx-misc/build openfx-io/build -name "*.ofx" -type f); do
              file "$f"
              if ldd "$f" | grep "not found"; then echo "::error::$f has unresolved libraries"; bad=1; fi
            done
            # IO.ofx must have picked up FFmpeg (else it silently builds without video nodes).
            io=$(find openfx-io/build -name IO.ofx -type f | head -1)
            ldd "$io" | grep -E "libavcodec|libx264|libx265" || { echo "::error::IO.ofx was built without FFmpeg"; bad=1; }
            if [ "$FV" = true ]; then
              for f in $B/App/Natron $B/Renderer/NatronRenderer; do
                grep -q built-in.FastVolumeRender "$f" && echo "FastVolumeRender present in $f" \
                  || { echo "::error::FastVolumeRender missing from $f"; bad=1; }
              done
            fi
            ccache --show-stats || true
            exit $bad
          '

      - name: Start Natron headless (build tree)
        continue-on-error: true
        run: |
          docker exec natron-build bash -c '
            QT_QPA_PLATFORM=offscreen timeout 300 gdb -q -batch -ex run -ex "thread apply all bt 30" \
              --args /w/natron/build/App/Natron --version 2>&1 | tail -150
          '

      - name: Package
        run: docker exec natron-build bash /w/natron/tools/linux/package.sh /w "$NAME"

      - name: Build AppImage
        run: |
          docker exec -e NAME natron-build bash -eo pipefail -c '
            cd /w
            # The images Qt needs FreeType 2.13 + its HarfBuzz; both are on the
            # AppImage excludelist, and Rocky 8 hosts have FreeType 2.9. Bundle them.
            export FORCE_BUNDLE_LIBS="$(ls /usr/local/lib*/libfreetype.so.6 /usr/local/lib*/libharfbuzz.so.0 2>/dev/null | tr "\n" " ")"
            [ -n "$FORCE_BUNDLE_LIBS" ] || { echo "::error::image FreeType/HarfBuzz not found in /usr/local"; exit 1; }
            bash natron/tools/appimage/build-appimage.sh dist/Natron appimage "Natron-$NAME-x86_64.AppImage"
          '
          echo "Minimum glibc: $(cat appimage/*.glibc.txt)" >> "$GITHUB_STEP_SUMMARY"

      # Files written in the container are root-owned; hand them back to the
      # runner user so the cache and upload steps can read them.
      - name: Fix workspace ownership
        if: always()
        run: docker exec natron-build chown -R "$(id -u):$(id -g)" /w || true

      - name: Save extra deps
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: extra-deps
          key: portable-deps-${{ env.ASWF_TAG }}-${{ env.DEPS_KEY }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: portable-ccache-${{ env.ASWF_TAG }}-${{ inputs.build_type }}-${{ github.sha }}

      - name: Collect error summary
        if: failure()
        run: |
          {
            echo '### Build errors (first 60)'
            echo '```'
            grep -hE 'error:|undefined reference|CMake Error|not found' configure.log build.log plugins.log 2>/dev/null | sort -u | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.NAME }}
          path: |
            configure.log
            build.log
            plugins.log
            natron/build/CMakeCache.txt
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Natron-${{ env.NAME }}
          path: Natron-${{ env.NAME }}.tar.gz
          retention-days: 14

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Natron-${{ env.NAME }}-debug-symbols
          path: Natron-${{ env.NAME }}-debug-symbols.tar.gz
          retention-days: 7

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Natron-${{ env.NAME }}-AppImage
          path: appimage/
          retention-days: 14

      - name: Stop the build container
        if: always()
        run: docker rm -f natron-build || true

  # The target platform itself: a plain Rocky Linux 8 container with only what
  # a desktop provides (GL, X11, fonts, and the libraries on the AppImage
  # excludelist). Any library the AppImage failed to bundle shows up here.
  # Artifacts are downloaded on the host and the checks run via `docker run`,
  # so the GitHub actions themselves don't need to run on Rocky 8.
  appimage-test:
    name: AppImage on Rocky Linux 8
    needs: portable
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: Natron-${{ env.NAME }}-AppImage
          path: t

      - name: Download debug symbols
        uses: actions/download-artifact@v4
        with:
          name: Natron-${{ env.NAME }}-debug-symbols
          path: t

      - name: Test on Rocky Linux 8
        run: |
          docker run --rm -v "$PWD/t:/t" -w /t rockylinux/rockylinux:8 bash -o pipefail -c '
            echo "== Desktop baseline"
            dnf install -y -q --setopt=install_weak_deps=False --skip-broken \
              file binutils findutils tar gzip gdb \
              mesa-libGL mesa-libEGL libglvnd-glx libglvnd-egl libglvnd-opengl fontconfig freetype harfbuzz \
              libX11 libxcb libxkbcommon libxkbcommon-x11 xcb-util-wm xcb-util-image \
              xcb-util-keysyms xcb-util-renderutil libSM libICE fribidi alsa-lib >/dev/null
            ldd --version | sed -n 1p
            sed "s/^/AppImage needs /" *.glibc.txt

            echo "== Every bundled binary resolves"
            chmod +x *.AppImage
            ./*.AppImage --appimage-extract >/dev/null
            bad=0
            while IFS= read -r f; do
              # Plain ldd resolves through the bundled RPATHs, as a launch does.
              missing=$({ ldd "$f" 2>/dev/null || true; } | awk "/not found/ {print \$1}")
              if [ -n "$missing" ]; then echo "$f: $missing"; bad=1; fi
            done < <(find squashfs-root/usr -type f -exec sh -c "file -b \"\$1\" | grep -q ELF" _ {} \; -print)
            [ "$bad" -eq 0 ] && echo "All bundled binaries resolve on Rocky Linux 8"

            echo "== Headless start (informational)"
            QT_QPA_PLATFORM=offscreen timeout 120 squashfs-root/AppRun --version \
              || echo "headless start exited with $?"

            echo "== Backtrace of the headless start (informational)"
            tar -xzf Natron-*-debug-symbols.tar.gz
            cp debug/Natron.debug squashfs-root/usr/bin/
            # "info symbol" names the library holding the crash address;
            # "info sharedlibrary" shows which copies (bundled or host) loaded.
            APPDIR="$PWD/squashfs-root" QT_QPA_PLATFORM=offscreen timeout 300 \
              gdb -q -batch -ex run -ex "thread apply all bt 30" \
              -ex "info symbol \$pc" -ex "info sharedlibrary" \
              --args squashfs-root/usr/bin/Natron --version 2>&1 | tail -250 || true

            exit $bad
          '
