# Linux build of the Qt6 fork (Natron + Cycles + the OFX plugins), in a Fedora
# container on a GitHub-hosted runner. Mirrors tools/win-build (03-cycles,
# 04-natron, 05-plugins, 06-install) with Fedora's system packages instead of
# MSYS2. Plugin refs and patches come from tools/win-build, so both platforms
# build the same pinned plugin sources.
#
# Manual trigger only for now (Actions tab -> "Linux Build" -> Run workflow)
# until the build is green; add a `push:` trigger after that.
#
# Result: a tarball built against Fedora's shared libraries (runs on Fedora 44).
# The distributable AppImage comes from linux-portable.yml (built on Rocky 8,
# glibc 2.28); this workflow's AppImage step was dropped in favour of it.

name: Linux Build

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Build Cycles + CyclesRender'
        type: boolean
        default: true
      fastvolume:
        description: 'Build FastVolumeRender (wgpu-native)'
        type: boolean
        default: true
      build_type:
        description: 'CMake build type'
        type: choice
        options: [RelWithDebInfo, Release, Debug]
        default: RelWithDebInfo

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FEDORA: '44'
  # Same fork branch the Windows build pins (tools/win-build/config.sh CYCLES_REF):
  # Natron's CyclesRenderer needs the deep-EXR output API that only exists there.
  CYCLES_REPO: Niik-l/cycles
  CYCLES_REF: feature/cycles-deep
  # wgpu-native release whose headers are byte-identical to the local
  # Windows wgpu/ (webgpu.h + wgpu.h); the zip checksum pins the download.
  WGPU_VERSION: v27.0.4.0
  WGPU_SHA256: 271481ef76fbf3ea09631a6079e9493636ecf813cd9c92306c44a1a452991ba1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G

jobs:
  linux:
    name: Fedora ${{ inputs.build_type }}${{ inputs.cycles && ' + Cycles' || '' }}
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 340
    # The container's default is `sh -e`; the steps use pipefail/PIPESTATUS.
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - name: Install build dependencies
        run: |
          # git must exist before actions/checkout, or it falls back to a
          # tarball download without submodules.
          dnf install -y git
          # --skip-unavailable: a wrong/renamed package name must not abort
          # the whole install; the next step reports anything missing.
          dnf install -y --skip-unavailable \
            cmake ninja-build gcc-c++ ccache pkgconf-pkg-config findutils zstd file \
            python3-devel boost-devel expat-devel cairo-devel fontconfig-devel \
            python3-QtPy python3-packaging \
            qt6-qtbase-devel qt6-qtbase-private-devel \
            python3-pyside6-devel python3-shiboken6-devel pyside6-tools shiboken6 \
            clang-devel llvm-devel \
            libX11-devel wayland-devel extra-cmake-modules \
            mesa-libGL-devel mesa-libEGL-devel mesa-libGLU-devel \
            openexr-devel imath-devel alembic-devel \
            OpenImageIO-devel OpenColorIO-devel openvdb-devel tbb-devel \
            embree-devel oidn-devel opensubdiv-devel openpgl-devel \
            pugixml-devel libzstd-devel libpng-devel libjpeg-turbo-devel libtiff-devel \
            openjpeg2-devel libwebp-devel \
            make curl patch unzip binutils appstream patchelf LibRaw-devel \
            libavcodec-free-devel libavformat-free-devel libavutil-free-devel \
            libswscale-free-devel libswresample-free-devel

      # NanoVDB is header-only and part of the OpenVDB source tree. Fedora's
      # openvdb-devel doesn't ship it (MSYS2's does), so fetch the headers of
      # the exact OpenVDB version Fedora installed.
      - name: Install NanoVDB headers
        run: |
          ver=$(rpm -q --qf '%{VERSION}' openvdb-devel)
          echo "OpenVDB $ver"
          curl -fsSL "https://github.com/AcademySoftwareFoundation/openvdb/archive/refs/tags/v$ver.tar.gz" \
            | tar -xz -C /tmp "openvdb-$ver/nanovdb/nanovdb"
          mkdir -p /usr/local/include
          cp -r "/tmp/openvdb-$ver/nanovdb/nanovdb" /usr/local/include/
          test -f /usr/local/include/nanovdb/NanoVDB.h

      - name: Report toolchain + missing pieces
        run: |
          set +e
          gcc --version | head -1; cmake --version | head -1; python3 --version
          echo "--- installed Qt/PySide/Shiboken packages"
          rpm -qa | grep -iE '^(qt6-qtbase|python3-pyside6|python3-shiboken6|pyside6|shiboken6)' | sort
          echo "--- CMake package configs the build needs"
          for cfg in Qt6Config Shiboken6Config Shiboken6ToolsConfig PySide6Config \
                     OpenImageIOConfig OpenColorIOConfig ECMConfig; do
            hit=$(find /usr/lib64/cmake /usr/lib/cmake /usr/share -name "$cfg.cmake" 2>/dev/null | head -1)
            printf '%-24s %s\n' "$cfg" "${hit:-MISSING}"
          done
          echo "--- libraries the Cycles link needs"
          for lib in embree4 OpenImageDenoise tbb osdCPU osdGPU pugixml openpgl openvdb Alembic; do
            hit=$(ls /usr/lib64/lib$lib.so* 2>/dev/null | head -1)
            printf '%-20s %s\n' "$lib" "${hit:-MISSING}"
          done
          echo "--- libraries/headers the Cycles configure needs"
          for lib in openjp2 webp; do
            hit=$(ls /usr/lib64/lib$lib.so* 2>/dev/null | head -1)
            printf '%-20s %s\n' "$lib" "${hit:-MISSING}"
          done
          hit=$(find /usr/include /usr/local/include -path '*nanovdb/NanoVDB.h' 2>/dev/null | head -1)
          printf '%-20s %s\n' "nanovdb/NanoVDB.h" "${hit:-MISSING}"
          echo "--- Python modules Natron imports at startup"
          for mod in PySide6 shiboken6 qtpy packaging; do
            hit=$(python3 -c "import $mod, os; print(os.path.dirname($mod.__file__))" 2>/dev/null)
            printf '%-20s %s\n' "$mod" "${hit:-MISSING}"
          done
          exit 0

      - name: Checkout Natron
        uses: actions/checkout@v4
        with:
          path: natron
          submodules: recursive

      # Same pinned commits as the Windows build (tools/win-build/config.sh),
      # so the patches in tools/win-build/patches apply on both platforms.
      - name: Read pinned plugin refs
        id: refs
        run: |
          cfg=natron/tools/win-build/config.sh
          misc=$(grep -m1 '^OPENFX_MISC_REF=' "$cfg" | cut -d'"' -f2)
          io=$(grep -m1 '^OPENFX_IO_REF=' "$cfg" | cut -d'"' -f2)
          echo "openfx-misc @ $misc"; echo "openfx-io   @ $io"
          [ -n "$misc" ] && [ -n "$io" ] || { echo "::error::could not read plugin refs from $cfg"; exit 1; }
          echo "misc=$misc" >> "$GITHUB_OUTPUT"
          echo "io=$io" >> "$GITHUB_OUTPUT"

      - name: Checkout openfx-misc
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx-misc
          ref: ${{ steps.refs.outputs.misc }}
          path: openfx-misc
          submodules: recursive

      - name: Checkout openfx-io
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/openfx-io
          ref: ${{ steps.refs.outputs.io }}
          path: openfx-io
          submodules: recursive

      # Community PyPlugs (content only; the Windows build also tracks tip).
      - name: Checkout natron-plugins
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/natron-plugins
          path: natron-plugins

      - name: Checkout Cycles fork
        if: inputs.cycles
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CYCLES_REPO }}
          ref: ${{ env.CYCLES_REF }}
          path: cycles

      - name: Cycles cache key
        if: inputs.cycles
        id: cycles-key
        run: echo "sha=$(git -C cycles rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Cycles is the long pole and rarely changes: cache its whole build dir
      # per (Fedora, cycles commit, build type).
      - name: Restore Cycles build
        if: inputs.cycles
        id: cycles-cache
        uses: actions/cache@v4
        with:
          path: cycles/build
          key: cycles-f${{ env.FEDORA }}-${{ steps.cycles-key.outputs.sha }}-${{ inputs.build_type }}

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-f${{ env.FEDORA }}-${{ inputs.build_type }}-${{ github.sha }}
          restore-keys: ccache-f${{ env.FEDORA }}-${{ inputs.build_type }}-

      - name: Build Cycles
        if: inputs.cycles && steps.cycles-cache.outputs.cache-hit != 'true'
        working-directory: cycles
        run: |
          # Flags match tools/win-build/03-cycles.sh (CPU only, system libs),
          # plus HYDRA_RENDER_DELEGATE=OFF: it defaults ON and forces WITH_USD
          # back on, which then demands Python 3.11 on Linux (Windows skips
          # that check, so the Windows scripts never needed it).
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWITH_CYCLES_STANDALONE=ON -DWITH_CYCLES_STANDALONE_GUI=OFF \
            -DWITH_CYCLES_HYDRA_RENDER_DELEGATE=OFF \
            -DWITH_CYCLES_USD=OFF -DWITH_USD=OFF -DWITH_CYCLES_OSL=OFF \
            -DWITH_CYCLES_DEVICE_CUDA=OFF -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF -DWITH_CYCLES_DEVICE_ONEAPI=OFF \
            -DWITH_CYCLES_EMBREE=ON -DWITH_CYCLES_OPENIMAGEDENOISE=ON \
            -DWITH_CYCLES_OPENCOLORIO=ON -DWITH_CYCLES_OPENSUBDIV=ON \
            -DWITH_CYCLES_OPENVDB=ON -DWITH_CYCLES_ALEMBIC=OFF \
            -DWITH_CYCLES_LOGGING=OFF -DWITH_LIBS_PRECOMPILED=OFF
          ninja -C build -j"$(nproc)"
          test -f build/lib/libcycles_subd.a || { echo "::error::Cycles build incomplete (libcycles_subd.a missing)"; exit 1; }

      # Same flat layout as the Windows wgpu/ folder (headers + library side
      # by side). Linux links the static archive; see Engine/CMakeLists.txt.
      - name: Fetch wgpu-native
        if: inputs.fastvolume
        run: |
          curl -fsSL -o wgpu.zip \
            "https://github.com/gfx-rs/wgpu-native/releases/download/$WGPU_VERSION/wgpu-linux-x86_64-release.zip"
          echo "$WGPU_SHA256  wgpu.zip" | sha256sum -c -
          unzip -q wgpu.zip -d wgpu-release
          mkdir -p wgpu
          cp wgpu-release/include/webgpu/webgpu.h wgpu-release/include/webgpu/wgpu.h \
             wgpu-release/lib/libwgpu_native.a wgpu/
          ls -la wgpu

      - name: Configure Natron
        working-directory: natron
        run: |
          # App/CMakeLists.txt looks for TBB as "tbb12" (MSYS2's name); Fedora
          # ships libtbb.so.12 as plain "tbb". A preset cache var wins over
          # find_library, so no source change is needed.
          TBB=$(ls /usr/lib64/libtbb.so | head -1)
          # Engine hard-codes MSYS2's Imath/OpenEXR include dirs; add Fedora's.
          export CXXFLAGS="-isystem /usr/include/Imath -isystem /usr/include/OpenEXR"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DNATRON_QT6=ON \
            -DNATRON_BUILD_TESTS=OFF \
            -DNATRON_FASTVOLUME=${{ inputs.fastvolume && 'ON' || 'OFF' }} \
            -DNATRON_WGPU_DIR="$GITHUB_WORKSPACE/wgpu" \
            -DNATRON_CYCLES=${{ inputs.cycles && 'ON' || 'OFF' }} \
            -DNATRON_CYCLES_DIR="$GITHUB_WORKSPACE/cycles" \
            -DNATRON_CYCLES_BUILD_DIR="$GITHUB_WORKSPACE/cycles/build" \
            -DNATRON_LLVM_INSTALL_DIR=/usr \
            -DTBB_LIB="$TBB" \
            2>&1 | tee "$GITHUB_WORKSPACE/configure.log"
          exit "${PIPESTATUS[0]}"

      - name: Build Natron
        working-directory: natron
        run: |
          # -k 0: keep going past errors so one run shows every file that fails
          # on Linux, not just the first.
          set -o pipefail
          ninja -C build -k 0 -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Mirrors tools/win-build/02-patch.sh + 05-plugins.sh. Runs even if the
      # Natron build failed, so one run reports errors from both.
      - name: Build OFX plugins
        if: ${{ !cancelled() }}
        run: |
          P="$GITHUB_WORKSPACE/natron/tools/win-build/patches"
          for repo in openfx-misc openfx-io; do
            if git -C "$repo" apply --reverse --check "$P/$repo.patch" 2>/dev/null; then
              echo "$repo: patch already applied"
            else
              git -C "$repo" apply "$P/$repo.patch"
              echo "$repo: applied $repo.patch"
            fi
          done
          # openfx-io forces C++14 when it detects OIIO >= 2.3, but OIIO 3's
          # headers need C++17 (std::byte). MSYS2's find module doesn't report
          # the version, so Windows keeps GCC's C++17 default; Fedora's does.
          sed -i 's/set(CMAKE_CXX_STANDARD 14)/set(CMAKE_CXX_STANDARD 17)/' openfx-io/CMakeLists.txt
          grep -q 'set(CMAKE_CXX_STANDARD 17)' openfx-io/CMakeLists.txt
          # openfx-misc fetches its pinned CImg.h at build time.
          make -C openfx-misc/CImg CImg.h
          # CMAKE_POLICY_VERSION_MINIMUM: the plugin CMakeLists predate CMake 4.
          fail=0
          for repo in openfx-misc openfx-io; do
            { cmake -S "$repo" -B "$repo/build" -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              && ninja -C "$repo/build" -k 0 -j"$(nproc)"; } 2>&1 \
              | tee -a "$GITHUB_WORKSPACE/plugins.log" || fail=1
          done
          for p in Misc CImg IO; do
            find openfx-misc/build openfx-io/build -name "$p.ofx" -type f | grep -q . \
              || { echo "::error::$p.ofx was not built"; fail=1; }
          done
          exit $fail

      - name: Check the binaries link
        run: |
          B=natron/build
          bad=0
          for f in $B/App/Natron $B/Renderer/NatronRenderer $B/PythonBin/natron-python \
                   $(find openfx-misc/build openfx-io/build -name '*.ofx' -type f); do
            file "$f"
            if ldd "$f" | grep 'not found'; then
              echo "::error::$f has unresolved shared libraries"; bad=1
            fi
          done
          # The node's plugin ID string only exists if FastVolume compiled in.
          if ${{ inputs.fastvolume }}; then
            for f in $B/App/Natron $B/Renderer/NatronRenderer; do
              grep -q 'built-in.FastVolumeRender' "$f" \
                && echo "FastVolumeRender present in $f" \
                || { echo "::error::FastVolumeRender missing from $f"; bad=1; }
            done
          fi
          ccache --show-stats || true
          exit $bad

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-f${{ env.FEDORA }}-${{ inputs.build_type }}-${{ github.sha }}

      - name: Collect error summary
        if: failure()
        run: |
          # First lines of every distinct compiler/linker error, for a quick read
          # in the job summary; the full logs are in the artifact.
          {
            echo '### Build errors (first 60)'
            echo '```'
            grep -hE 'error:|undefined reference|CMake Error|not found' configure.log build.log plugins.log 2>/dev/null | sort -u | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-fedora${{ env.FEDORA }}-${{ inputs.build_type }}
          path: |
            configure.log
            build.log
            plugins.log
            natron/build/CMakeCache.txt
          if-no-files-found: ignore

      # Layout mirrors tools/win-build/06-install.sh. Natron resolves bundled
      # plugins as <exe dir>/../Plugins/{OFX/Natron,PyPlugs}.
      - name: Package
        run: |
          R="$GITHUB_WORKSPACE"; B="$R/natron/build"; D="$R/dist/Natron"; G="$R/dist/debug"
          rm -rf "$R/dist"
          mkdir -p "$D/bin" "$D/Plugins/OFX/Natron" "$D/Plugins/PyPlugs" "$D/Resources" "$G"
          cp "$B/App/Natron" "$B/Renderer/NatronRenderer" "$B/PythonBin/natron-python" "$D/bin/"

          for p in Misc CImg IO; do
            src=$(find openfx-misc/build openfx-io/build -name "$p.ofx" -type f | head -1)
            d="$D/Plugins/OFX/Natron/$p.ofx.bundle/Contents/Linux-x86-64"
            mkdir -p "$d"; cp "$src" "$d/"
          done

          cp -r "$B/Plugins/PyPlugs/." "$D/Plugins/PyPlugs/"
          cp -r natron-plugins/. "$D/Plugins/PyPlugs/"
          rm -rf "$D/Plugins/PyPlugs/.git" "$D/Plugins/PyPlugs/.github"

          curl -fsSL https://github.com/NatronGitHub/OpenColorIO-Configs/archive/Natron-v2.4.tar.gz \
            | tar -xz -C "$D/Resources"
          mv "$D/Resources/OpenColorIO-Configs-Natron-v2.4" "$D/Resources/OpenColorIO-Configs"

          # Strip every binary; keep its debug info in a separate .debug file
          # linked back by name (gdb finds it if placed next to the binary).
          while IFS= read -r f; do
            n=$(basename "$f")
            objcopy --only-keep-debug "$f" "$G/$n.debug"
            strip --strip-debug --strip-unneeded "$f"
            objcopy --add-gnu-debuglink="$G/$n.debug" "$f"
          done < <(find "$D/bin" "$D/Plugins/OFX" -type f \( -path '*/bin/*' -o -name '*.ofx' \))
          du -sh "$D" "$G"

          V="fedora${FEDORA}-${{ inputs.build_type }}"
          tar -C "$R/dist" -czf "$R/Natron-$V.tar.gz" Natron
          tar -C "$R/dist" -czf "$R/Natron-$V-debug-symbols.tar.gz" debug
          ls -la "$R"/Natron-*.tar.gz

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Natron-fedora${{ env.FEDORA }}-${{ inputs.build_type }}
          path: Natron-fedora${{ env.FEDORA }}-${{ inputs.build_type }}.tar.gz
          retention-days: 14

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Natron-fedora${{ env.FEDORA }}-${{ inputs.build_type }}-debug-symbols
          path: Natron-fedora${{ env.FEDORA }}-${{ inputs.build_type }}-debug-symbols.tar.gz
          retention-days: 7

      # Same headless start as the portable AppImage test, but from the
      # unstripped build on the build machine itself: a crash here is a Natron
      # startup bug, not a packaging one.
      - name: Start Natron headless (build tree)
        continue-on-error: true
        run: |
          dnf install -y -q gdb >/dev/null
          QT_QPA_PLATFORM=offscreen timeout 300 gdb -q -batch -ex run -ex 'thread apply all bt 30' \
            --args natron/build/App/Natron --version 2>&1 | tail -150
