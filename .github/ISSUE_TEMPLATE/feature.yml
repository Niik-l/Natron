name: Feature request
description: An idea for this fork — a new node, a knob, a workflow, a Nuke feature you miss.
title: "(Feature): "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. This fork is a one-person project focused on the 3D / Cycles / deep / particle side of compositing, so requests in those areas are the most likely to land. Ideas for stock Natron are welcome too but may fit better on the [upstream tracker](https://github.com/NatronGitHub/Natron/issues).
  - type: checkboxes
    attributes:
      label: Before you post
      options:
        - label: I searched the [open issues](https://github.com/Niik-l/Natron/issues) and this is not a duplicate
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - 3D system / geometry / cameras
        - Cycles rendering (materials, lights, AOVs, passes)
        - ScanlineRender
        - Deep compositing
        - Particles
        - Volumes
        - Read / Write / colorspace
        - Viewer / GUI / workflow
        - Something else
    validations:
      required: true
  - type: textarea
    attributes:
      label: What would you like, and what problem does it solve?
      description: Describe the workflow, not just the button. If Nuke, Fusion or Blender has this, name the feature there — it is the quickest way to explain it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How do you work around it today?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else
      description: Screenshots, mockups, links.
    validations:
      required: false
