name: Bug report
description: A crash, a wrong result, or something that does not work in this fork's Windows build (Qt6 / Cycles / 3D / deep / particles).
title: "(Bug): "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This tracker is for **this fork** (the Windows Qt6/Cycles build with the 3D, deep and particle nodes). Bugs in stock Natron nodes that also happen in the official release belong on the [upstream tracker](https://github.com/NatronGitHub/Natron/issues).
  - type: checkboxes
    attributes:
      label: Before you post
      options:
        - label: I'm on the latest release from this fork's [Releases page](https://github.com/Niik-l/Natron/releases), or a build of the current RB-2.6
          required: true
        - label: I've restarted Natron and the problem persists
          required: true
        - label: I searched the [open issues](https://github.com/Niik-l/Natron/issues) and this is not a duplicate
          required: true
  - type: input
    id: build-version
    attributes:
      label: Build version
      description: The release date from the archive name or the Releases page, or the commit if you built it yourself.
      placeholder: "natron-2.6-2026.09.07"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system and GPU
      placeholder: "Windows 11 23H2, NVIDIA RTX 4070 (driver 560)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is involved?
      multiple: true
      options:
        - 3D system (Scene3D, Card3D / geo nodes, Camera3D, 3D viewport)
        - Cycles (CyclesRender, CyclesRenderPass, materials, lights, AOVs)
        - ScanlineRender
        - Deep (DeepRead, DeepToPoints, DeepMerge, DeepReformat, ...)
        - Particles
        - Volumes (ReadVDB, Volume3D, FastVolumeRender)
        - Read / Write / colorspace
        - Viewer / GUI / project loading
        - Stock Natron node (also happens in official Natron)
        - Not sure
    validations:
      required: true
  - type: input
    id: ocio
    attributes:
      label: OCIO config in use
      description: From Preferences > Color. Matters for any Read / Write / colorspace / material texture problem.
      placeholder: "ACES 2.0 studio config (custom path) / blender / nuke-default"
    validations:
      required: false
  - type: textarea
    attributes:
      label: What happened, and what did you expect?
      description: |
        Screenshots help a lot. For a crash, paste the text from the terminal if you launched from one, or attach the `natron_crash_*.log` file from your `%TEMP%` folder. For a wrong render, a small project (.ntp) that reproduces it is the fastest way to get it fixed.

        Tip: drag images, logs or a zipped project into this box to attach them.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. New project, add a Card3D and a Camera3D...
        2. Connect to CyclesRender...
        3. Set ... to ...
        4. See ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else
      description: Node graph, custom plugin paths, whether it worked in an earlier release, etc.
    validations:
      required: false
