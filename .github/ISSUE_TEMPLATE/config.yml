# Issue chooser for this fork's tracker.

blank_issues_enabled: true

contact_links:
  - name: Download the latest build
    url: https://github.com/Niik-l/Natron/releases
    about: Portable Windows archives (Qt6 / Cycles). Check you are on the latest one before reporting.
  - name: Node reference for the dev nodes
    url: https://github.com/Niik-l/Natron/blob/RB-2.6/NODE_REGISTRY.md
    about: One-line description of every node this fork adds (3D, Cycles, deep, particles, volumes).
  - name: Bugs in stock Natron
    url: https://github.com/NatronGitHub/Natron/issues
    about: If the problem also happens in the official Natron release, report it upstream instead.
  - name: Natron community forum
    url: https://discuss.pixls.us/c/software/natron/27
    about: General "how do I...?" questions about Natron itself.
